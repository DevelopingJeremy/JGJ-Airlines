<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personaliza tu viaje | JGJ Airlines</title>
    <link rel="stylesheet" href="../CSS/JGJ-Airlines-styles.css" type="text/css"> <!-- CSS Global -->
    <link rel="stylesheet" href="../CSS/Sistema Pago.css"> <!-- CSS Sistema Pago -->
    <link rel="stylesheet" href="../CSS/bootstrap.min.css">
    <script src="../Js/bootstrap.js"></script>
    <link rel="icon" type="image/png" href="../Multimedia/Iconos/Plane_icon.png">
</head>

<body class="body-index">
    <!-- Header de la página -->
    <header>
        <div id="back">
            <div class="menu container">

                <!-- Logo -->
                <a href="../Inicio - Reserva/index.html" class="logo"><img src="../Multimedia/Logo/Letras verde claro, Logo JGJ.png"
                    alt="Logo JGJ-Airlines Letras verde claro" style="height: 50px;"></a>
                <input type="checkbox" id="menu">

                <!-- Icono del menú interactivo -->
                <label for="menu">
                    <img src="../Multimedia/Iconos/Menu_Icon.png" class="menu-icono" alt="">
                </label>

                <!-- Lista interactiva del header -->
                <nav class="navbar">
                    <ul>
                        <li><a href="../Inicio - Reserva/index.html">Reserva</a></li>
                        <li><a href="../Ofertas, Destinos, Tarifas/ofertas.html">Ofertas</a></li>
                        <li><a href="../Ofertas, Destinos, Tarifas/destinos.html">Destinos</a></li>
                        <li><a href="../Ofertas, Destinos, Tarifas/tarifas.html">Tarifas</a></li>
                        <li><a href="../Sobre nosotros - Centro Ayuda/centro-ayuda.html">Centro de Ayuda</a></li>
                        <li><a href="../Cuenta/log-in.html"><img src="../Multimedia/Iconos/User_icon.png" alt=""
                                    style="height: 25px;"></a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Contiene todo lo del sistema de pago -->
    <div class="container-proceso-facturacion">

        <!-- Fieldeset que encuapsula todo -->
        <fieldset>

            <!-- Titulo -->
            <h1>Proceso de Pago</h1>
            <form action="#" method="post" id="form-pago">

                <!-- Nombre del titular -->
                <label for="cardName">Nombre del Titular:</label>
                <input type="text" id="cardName" name="cardName" placeholder="Ingresa el nombre del titular" required>

                <!-- Correro electronico para la factura -->
                <label for="email">Correo Electrónico para Facturación:</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>

                <!-- Numeros de la tarjeta formato xxxx xxxx xxxx xxxx -->
                <label for="cardNumber">Número de Tarjeta:</label>
                <input type="number" id="cardNumber" name="cardNumber" placeholder="Ingresa tu número de tarjeta"
                    required maxlength="16" minlength="16">

                <!-- Fecha de expiracion formato xx/xx -->
                <label for="expiryDate">Fecha de Expiración:</label>
                <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/AA" required>

                <!-- CVV de la tarjeta formato xxx -->
                <label for="cvv">CVV:</label>
                <input type="number" id="cvv" name="cvv" placeholder="CVV" required maxlength="3" minlength="3">

                <!-- Botón pagar -->
                <button type="submit">Pagar Ahora</button>

            </form>
        </fieldset>
    </div>
    <script src="../Js/Pago/Datos-pago.js"></script>
</body>

</html>
