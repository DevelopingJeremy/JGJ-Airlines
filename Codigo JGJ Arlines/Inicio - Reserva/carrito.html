    <!-- Barra de reservación de vuelos interactiva -->
    <div id="barra-reservacion-vuelo">

        <!-- Título de la Barra de Reservación -->
        <div id="encabezado-reservacion-vuelo">
            <h1>¡Reservá ahora!</h1>
        </div>

        <!-- Caja Información de la barra interactiva -->
        <div id="informacion-reservacion-vuelo">

            <!-- Opciones de rellenado de información de la barra -->
            <div id="rellenado-reservacion-vuelo">
                <nav class="rellenado-vuelo-navbar">
                    <form action="" method="post" id="selecciones-informacion-barra-reservacion">

                        <div id="titulos-reservacion">
                            <h1 class="origen-reserva">Origen</h1>
                            <h1 class="destino-reserva">Destino</h1>
                            <h1 class="ida-reserva">Ida</h1>
                            <h1 class="vuelta-reserva">Vuelta</h1>
                            <h1 class="pasajeros-reserva">Pasajeros</h1>
                        </div>

                        <!-- Escoger Origen del vuelo -->
                        <select name="Origen" id="origen-reservacion-vuelo">
                            <option value="0">Origen</option>
                            <option value="1">Alajuela, Costa Rica</option>
                            <option value="2">Guanacaste, Costa Rica</option>
                            <option value="3">Amsterdam, Países Bajos</option>
                            <option value="4">Banff National Park, Canadá</option>
                            <option value="5">Barcelona, España</option>
                            <option value="6">Bora Bora, Polinesia Francesa</option>
                            <option value="7">Cancún, México</option>
                            <option value="8">Cinque Terre, Italia</option>
                            <option value="9">Ciudad de México, México</option>
                            <option value="10">Costa Amalfitana</option>
                            <option value="11">Fiordos Noruegos, Noruega</option>
                            <option value="12">Islas Galápagos, Ecuador</option>
                            <option value="13">Islas Lofoten, Noruega</option>
                            <option value="14">Kyoto, Japón</option>
                            <option value="15">Madrid, España</option>
                            <option value="16">New York, EEUU</option>
                            <option value="17">París, Francia</option>
                            <option value="18">Sidney, Australia</option>
                        </select>

                        <!-- Escoger Destino del vuelo -->
                        <select name="Destino" id="destino-reservacion-vuelo">
                            <option value="0">Destino</option>
                            <option value="1">Alajuela, Costa Rica</option>
                            <option value="2">Guanacaste, Costa Rica</option>
                            <option value="3">Amsterdam, Países Bajos</option>
                            <option value="4">Banff National Park, Canadá</option>
                            <option value="5">Barcelona, España</option>
                            <option value="6">Bora Bora, Polinesia Francesa</option>
                            <option value="7">Cancún, México</option>
                            <option value="8">Cinque Terre, Italia</option>
                            <option value="9">Ciudad de México, México</option>
                            <option value="10">Costa Amalfitana</option>
                            <option value="11">Fiordos Noruegos, Noruega</option>
                            <option value="12">Islas Galápagos, Ecuador</option>
                            <option value="13">Islas Lofoten, Noruega</option>
                            <option value="14">Kyoto, Japón</option>
                            <option value="15">Madrid, España</option>
                            <option value="16">New York, EEUU</option>
                            <option value="17">París, Francia</option>
                            <option value="18">Sidney, Australia</option>
                        </select>
                        
                        <!-- Escoger Fecha de ida del vuelo -->
                        <input type="date" id="fecha-id-reservacion-vuelo" placeholder="Ida">

                        <!-- Escoger Fecha de vuelta del vuelo -->
                        <input type="date" id="fecha-vuelta-reservacion-vuelo">

                        <!-- Escoger Número de pasajeros del vuelo -->
                        <!-- Escoger Destino del vuelo -->
                        <select name="Pasajeros" id="numero-pasajeros-">
                            <option value="0"># Pasajeros</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>

                        <!-- Botón de envío para realizar la búsqueda de la información del vuelo -->
                        <button type="submit" class="enviar-reservacion-vuelo" id="continuar-btn">Continuar</button>
